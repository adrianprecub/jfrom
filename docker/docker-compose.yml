name: jfr2grafana

services:
  sample-app:
    build:
      context: ..
      dockerfile: sample-app/Dockerfile
    image: jfr2grafana-sample-app
    ports:
      - "8080:8080"
      - "9404:9404"
    healthcheck:
      # eclipse-temurin:25-jdk has neither curl nor wget; CMD-SHELL runs
      # /bin/sh (dash), which lacks /dev/tcp, so invoke bash explicitly for
      # a dependency-free HTTP check.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - "--promscrape.config=/etc/victoriametrics/scrape.yml"
      - "--retentionPeriod=1d"
      - "--promscrape.configCheckInterval=5s"
    volumes:
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    ports:
      - "8428:8428"
    depends_on:
      sample-app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Land on the JFR dashboard with no clicks, declaratively. Setting this through
      # Grafana's API instead would live only in the grafana-data volume, so a fresh
      # `up.sh` on a clean machine would open the default home dashboard instead.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jvm-jfr.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics

volumes:
  grafana-data:
