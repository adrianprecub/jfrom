# File-based dashboard provider. Points at the directory bind-mounted from
# docker/grafana/dashboards/ (empty for now - Wave 4 drops jvm-jfr.json
# there). updateIntervalSeconds is short so a dashboard added later, or
# edited live, is picked up without restarting Grafana.
apiVersion: 1

providers:
  - name: jfr2grafana
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
